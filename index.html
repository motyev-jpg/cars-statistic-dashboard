<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רכבים שנמסרו לפי שנה - 4 היצרנים המובילים בכל שנה</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="data/deliveries.js"></script>
<style>
  :root { --bg:#fff; --fg:#1d2733; --muted:#5f6b7a; --line:#e3e7ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --fg:#e8ecf0; --muted:#9aa5b1; --line:#2a313a; } }
  body { font-family: system-ui, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:24px; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.9rem; }
  .tiles { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .tile { flex:1 1 130px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .tile b { display:block; font-size:1.2rem; }
  .tile span { color:var(--muted); font-size:.8rem; }
  .tile i, .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-inline-end:6px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin:10px 0; font-size:.85rem; }
  .toggle { margin-bottom:8px; }
  button { border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:6px 14px; cursor:pointer; border-radius:6px; }
  button.on { background:var(--fg); color:var(--bg); }
  .chart { position:relative; height:460px; direction:ltr; }
  table { border-collapse:collapse; width:100%; margin-top:24px; font-variant-numeric:tabular-nums; }
  th, td { border-bottom:1px solid var(--line); padding:8px; text-align:start; }
  td i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-inline-end:6px; }
  .note { color:var(--muted); font-size:.8rem; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>רכבים שנמסרו בישראל: 4 היצרנים המובילים בכל שנה</h1>
  <p class="sub" id="sub"></p>
  <div class="tiles" id="tiles"></div>
  <div class="toggle">
    <button id="bTop" class="on">מובילים בכל שנה</button>
    <button id="bLine">מגמה לפי יצרן</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="chart"><canvas id="chart"></canvas></div>
  <table id="table"></table>
  <p class="note" id="note"></p>
</main>
<script>
const D = window.DELIVERIES;
// Okabe-Ito colorblind-safe palette, one color per brand.
const PALETTE = ["#0072B2", "#E69F00", "#009E73", "#CC79A7", "#56B4E9", "#D55E00", "#F0E442", "#999999"];
const color = {};
D.brands.forEach((b, i) => color[b.name] = PALETTE[i % PALETTE.length]);
const val = (name, j) => D.brands.find(b => b.name === name).deliveries[j];
const fmt = n => n.toLocaleString("he-IL");
const labels = D.years.map(y => y === D.partial_year ? y + " (חלקית)" : String(y));
const RANKS = D.top_by_year[0].length;

document.getElementById("sub").textContent =
  `רכב נוסעים בלבד, ${D.years[0]}–${D.years.at(-1)}. כל היצרנים נבדקים, כך שיצרנים חדשים נכנסים אוטומטית. מקור: data.gov.il. עודכן: ${D.generated}`;

document.getElementById("tiles").innerHTML = D.brands.map(b =>
  `<div class="tile"><i style="background:${color[b.name]}"></i><span>${b.name}</span><b>${fmt(b.deliveries.reduce((a, c) => a + c, 0))}</b><span>סה"כ ${D.years.length} שנים</span></div>`).join("");

document.getElementById("legend").innerHTML = D.brands.map(b => `<span><i style="background:${color[b.name]}"></i>${b.name}</span>`).join("");

const head = `<tr><th>שנה</th>${Array.from({ length: RANKS }, (_, r) => `<th>מקום ${r + 1}</th>`).join("")}</tr>`;
document.getElementById("table").innerHTML = head + D.years.map((y, j) =>
  `<tr><td>${labels[j]}</td>${D.top_by_year[j].map(n => `<td><i style="background:${color[n]}"></i>${n}: ${fmt(val(n, j))}</td>`).join("")}</tr>`).join("");

document.getElementById("note").textContent =
  `הגדרה: שנת העלייה הראשונה לכביש. המאגר כולל רק רכבים שעדיין רשומים, ולכן שנים ישנות מוצגות בחסר קל. ${D.partial_year} חלקית. יצרנים מאוחדים בין מדינות ייצור.`;

// Draws the brand name inside each bar.
const barNames = {
  id: "barNames",
  afterDatasetsDraw(c) {
    if (c.config.type !== "bar") return;
    const ctx = c.ctx;
    ctx.save(); ctx.font = "11px system-ui"; ctx.fillStyle = "#000"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    c.data.datasets.forEach((ds, i) => c.getDatasetMeta(i).data.forEach((bar, j) => {
      ctx.save(); ctx.translate(bar.x, bar.base - 6); ctx.rotate(-Math.PI / 2);
      ctx.fillText(D.top_by_year[j][i], 0, 0); ctx.restore();
    }));
    ctx.restore();
  },
};

let chart;
function draw(mode) {
  if (chart) chart.destroy();
  const top = mode === "top";
  const datasets = top
    ? Array.from({ length: RANKS }, (_, r) => ({
        label: `מקום ${r + 1}`,
        data: D.years.map((_, j) => val(D.top_by_year[j][r], j)),
        backgroundColor: D.years.map((_, j) => color[D.top_by_year[j][r]]),
      }))
    : D.brands.map(b => ({
        label: b.name, data: b.deliveries, borderColor: color[b.name], backgroundColor: color[b.name],
        tension: .25, borderWidth: 2.5, pointRadius: 3,
      }));
  chart = new Chart(document.getElementById("chart"), {
    type: top ? "bar" : "line",
    data: { labels, datasets },
    plugins: [barNames],
    options: {
      maintainAspectRatio: false,
      interaction: { mode: top ? "point" : "index", intersect: false },
      plugins: {
        legend: { display: !top },
        tooltip: { callbacks: { label: c => `${top ? D.top_by_year[c.dataIndex][c.datasetIndex] : c.dataset.label}: ${fmt(c.parsed.y)}` } },
      },
      scales: { y: { beginAtZero: true, ticks: { callback: v => fmt(v) } } },
    },
  });
  bTop.classList.toggle("on", top);
  bLine.classList.toggle("on", !top);
}
const bTop = document.getElementById("bTop"), bLine = document.getElementById("bLine");
bTop.onclick = () => draw("top");
bLine.onclick = () => draw("line");
draw("top");
</script>
</body>
</html>
